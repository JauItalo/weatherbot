<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Bot</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="chat">
        <header class="chat-header">
            <span class="logo" aria-hidden="true">🌤️</span>
            <div>
                <h1>Weather Bot</h1>
                <p>Previsão do tempo de qualquer cidade</p>
            </div>
        </header>

        <section id="messages" class="messages" aria-live="polite"></section>

        <form id="chat-form" class="chat-form" autocomplete="off">
            <input id="input" type="text" placeholder="Digite uma cidade, ex.: Lisboa"
                   maxlength="150" aria-label="Mensagem" required>
            <button type="submit" id="send">Enviar</button>
        </form>
    </main>

    <script src="app.js"></script>
</body>
</html>
