spring:
  application:
    name: weatherbot

server:
  port: 8080

weatherbot:
  open-meteo:
    geocoding-url: https://geocoding-api.open-meteo.com
    forecast-url: https://api.open-meteo.com
    connect-timeout: 3s
    read-timeout: 5s

  cache:
    geocoding-ttl: 24h
    forecast-ttl: 10m
management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs