services:
  weatherbot:
    build:
      context: .
      args:
        JAVA_VERSION: 17
    image: weatherbot:latest
    container_name: weatherbot
    ports:
      - "8080:8080"
    environment:
      TZ: America/Fortaleza
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s